duration_minutes = 10

[[sessions.items]]
subject = "Scheduling tasks with Slurm"
duration_minutes = 10

[[sessions.items]]
subject = "Slurm job dependencies"
duration_minutes = 15

[[sessions.items]]
subject = "Checkpointing and restarting jobs"
duration_minutes = 15

[[sessions.items]]
subject = "Slurm job arrays"
duration_minutes = 20

[[sessions.items]]
